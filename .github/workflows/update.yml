---
name: "Update"

on:
  schedule:
    - cron: '38 2 * * 1,4'
  workflow_dispatch:

env:
  python_version: "3.12"

jobs:
  update:
    name: Update
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v5
      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Initialize the repo
        run: task -v init
      - name: Cache the pre-commit cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pre-commit-
      - name: Update the repository
        run: task -v update
        env:
          # update-pins.py reads GitHub releases; unauthenticated runners share a rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create or update a pull request
        uses: peter-evans/create-pull-request@v6
        with:
          title: Automated update
          commit-message: Automated update
          committer: Automation <automation@jonzeolla.com>
          delete-branch: true
          signoff: true
