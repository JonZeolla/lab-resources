---
# Pure single-quoted PowerShell — the SSH DefaultShell is PowerShell; layered
# quote-escaping through a `powershell -Command "..."` wrapper is what breaks.
# The installer's auto-detection does not hold here: it gates its prompt on
# [Environment]::UserInteractive, which stays true for an SSH-launched
# PowerShell, so it asks a question nobody can answer. `raw` has no environment:
# keyword, and `iex (irm ...)` cannot take -y, so the env var is set inline.
- name: Run the Zenable CLI installer
  ansible.builtin.raw: |
    $env:ZENABLE_NONINTERACTIVE = '1'
    {% if zenable_cli_version %}$env:ZENABLE_VERSION = '{{ zenable_cli_version }}'
    {% endif %}Invoke-Expression (Invoke-RestMethod -Uri 'https://cli.zenable.app/install.ps1')

- name: Install machine-wide
  when: zenable_cli_machine_wide
  ansible.builtin.raw: |
    New-Item -ItemType Directory -Force -Path 'C:\Program Files\Zenable' | Out-Null
    Copy-Item ($env:USERPROFILE + '\.zenable\bin\zenable.exe') 'C:\Program Files\Zenable\zenable.exe' -Force
    $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
    if ($machinePath -notlike '*C:\Program Files\Zenable*') {
      [Environment]::SetEnvironmentVariable('Path', $machinePath + ';C:\Program Files\Zenable', 'Machine')
    }

- name: Test the Zenable CLI
  ansible.builtin.raw: |
    & 'C:\Program Files\Zenable\zenable.exe' version
  changed_when: false
