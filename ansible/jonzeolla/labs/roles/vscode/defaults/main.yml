---
# Exact version pin: images must not drift after snapshot. The RPM release
# field differs per architecture, so the pin is the upstream version alone.
# On EL8 only x86_64 installs: the aarch64 builds need a newer libstdc++
# (GLIBCXX_3.4.26) than EL8 ships.
vscode_version: "1.138.0"

# Users who get a VS Code launcher on their desktop. A streamed desktop's
# application menu is not guaranteed to list every .desktop entry the package
# installed, so a launcher in the user's Desktop folder is the one place the
# editor is always one click away. Each user must already exist. Empty means
# menu entry only.
vscode_launcher_users: []

# Also seed /etc/skel/Desktop, so an account the platform creates AFTER the
# image is taken (a streaming session's user, a lab attendee added later)
# starts with the launcher too. Off by default: it touches every future user
# on the host.
vscode_launcher_in_skel: false
