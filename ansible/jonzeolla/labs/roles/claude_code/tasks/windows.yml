---
- name: Install Claude Code machine-wide
  # Machine-wide because the nodejs dependency pinned npm's global prefix.
  ansible.builtin.raw: |
    $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine')
    npm install -g '@anthropic-ai/claude-code@{{ claude_code_version }}'

- name: Disable the auto-updater system-wide
  ansible.builtin.raw: |
    [Environment]::SetEnvironmentVariable('DISABLE_AUTOUPDATER', '1', 'Machine')

- name: Test Claude Code
  ansible.builtin.raw: |
    $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine')
    claude --version
  changed_when: false
