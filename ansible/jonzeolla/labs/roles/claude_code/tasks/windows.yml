---
- name: Install Node.js LTS machine-wide
  ansible.builtin.raw: powershell -ExecutionPolicy Bypass -Command "winget install --id OpenJS.NodeJS.LTS --source winget --scope machine --silent --accept-package-agreements --accept-source-agreements"
  register: node_install
  changed_when: "'already installed' not in (node_install.stdout | default(''))"
  failed_when:
    - node_install.rc != 0
    - "'already installed' not in (node_install.stdout | default(''))"

- name: Install Claude Code machine-wide
  # npm -g defaults to the per-user %APPDATA%\npm prefix on Windows, which a
  # different streaming user never sees; pin the prefix to the machine-wide
  # nodejs directory (already on the machine PATH).
  ansible.builtin.raw: powershell -ExecutionPolicy Bypass -Command "$env:Path = [Environment]::GetEnvironmentVariable('Path','Machine'); npm config set prefix 'C:\Program Files\nodejs'; npm install -g '@anthropic-ai/claude-code@{{ claude_code_version }}'"

- name: Disable the auto-updater system-wide
  ansible.builtin.raw: powershell -ExecutionPolicy Bypass -Command "[Environment]::SetEnvironmentVariable('DISABLE_AUTOUPDATER', '1', 'Machine')"

- name: Test Claude Code
  ansible.builtin.raw: powershell -ExecutionPolicy Bypass -Command "$env:Path = [Environment]::GetEnvironmentVariable('Path','Machine'); claude --version"
  changed_when: false
