---
# Exact version pin: images must not drift after snapshot. GitLab publishes
# no package repository and does not sign its RPMs, so the role installs the
# release's own RPM and the checksums below are the only integrity check.
gitlab_cli_version: "1.123.0"
# Release asset architecture names, keyed by ansible_architecture.
gitlab_cli_architectures:
  aarch64: arm64
  x86_64: amd64
gitlab_cli_checksums:
  aarch64: "sha256:0ce059bba56c751c136a34bd972196f3f225f97346357ef44d6224801068f9ab"
  x86_64: "sha256:569c206d5e4a155c5593415f706eb42d92f84707e08db1bf32724d9f0561bc90"
