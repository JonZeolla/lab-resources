---
- name: Ensure supported OS
  ansible.builtin.assert:
    that:
      - ansible_os_family in ['Debian', 'RedHat']
    fail_msg: "This playbook only supports Debian and RedHat based systems."
  run_once: true

- name: Install prereqs
  become: true
  when: ansible_os_family == 'Debian'
  ansible.builtin.apt:
    pkg:
      - ca-certificates
      - curl
      - jq
      - sudo
    update_cache: true
    install_recommends: no

- name: >
    Install via command on Amazon Linux 2 due to a lack of dnf, and
    that ansible.builtin.yum only works with python 2.7
  when: >
    ansible_os_family == 'RedHat' and
    ansible_distribution == 'Amazon' and
    ansible_distribution_version == '2' and
    ansible_python_version is ansible.builtin.version('2.7', '>')
  ansible.builtin.command:
    cmd: yum -y install ca-certificates curl jq sudo
  become: true

- name: Install prereqs
  become: true
  when: >
    ansible_os_family == 'RedHat' and
    ansible_distribution == 'Amazon' and
    ansible_distribution_version == '2023'
  ansible.builtin.dnf:
    name:
      - ca-certificates
      - curl
      - jq
      - sudo
    state: latest
    # Necessary due to curl/curl-minimal. skip_broken wasn't sufficient
    allowerasing: true

# Docker publishes RPMs for centos and rhel, NOT for rocky or almalinux, and
# get-docker.sh picks its repo from /etc/os-release ID with no way to override
# it — so on Rocky it adds a repo containing zero packages and the install dies
# with "Unable to find a match: docker-ce". Docker's own RHEL documentation
# points these distributions at the centos repo, which is what this does.
# Amazon Linux keeps the get-docker.sh path it already had.
- name: Use the centos repo on RedHat distributions Docker does not publish for
  ansible.builtin.set_fact:
    docker_use_centos_repo: "{{ ansible_os_family == 'RedHat' and ansible_distribution != 'Amazon' }}"

- name: Install Docker from the centos repo
  when: docker_use_centos_repo
  become: true
  block:
    - name: Install repo tooling
      ansible.builtin.dnf:
        name: dnf-plugins-core
        state: present

    - name: Add the Docker CE repository
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/centos/docker-ce.repo
        dest: /etc/yum.repos.d/docker-ce.repo
        mode: "0644"

    # containerd and the plugins version independently of the engine, so only
    # the engine and its CLI carry the pin.
    - name: Install Docker
      vars:
        docker_pin: "{{ ('-' ~ docker_version) if docker_version else '' }}"
      ansible.builtin.dnf:
        name:
          - "docker-ce{{ docker_pin }}"
          - "docker-ce-cli{{ docker_pin }}"
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        allowerasing: true

    - name: Start Docker
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started

- name: Download get-docker.sh
  when: not docker_use_centos_repo
  ansible.builtin.get_url:
    url: https://get.docker.com
    dest: /tmp/get-docker.sh
    mode: "0755"

# The `creates:` guard is kept ONLY when unpinned, where any docker will do and
# re-running would cost the installer's 20-second already-installed warning for
# nothing. With a pin the guard has to go: it skips whenever docker exists at
# all, so a version bump would silently never apply and the host would keep
# whatever it already had.
- name: Run get-docker.sh
  when: not docker_use_centos_repo
  become: true
  ansible.builtin.command: "bash /tmp/get-docker.sh"
  args:
    creates: "{{ '/usr/bin/docker' if not docker_version else omit }}"
  environment:
    VERSION: "{{ docker_version }}"

- name: Add the current user to the docker group
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true

# As root, because the group added above is NOT in effect yet: supplementary
# groups are fixed at login and this runs down the SSH session that was already
# open, so an unprivileged `docker version` fails on the socket even though the
# install succeeded. Root always reaches the socket, which is what this task is
# here to prove — that the daemon is up. Whether a particular user can reach it
# is a property of their next login, so assert that where the host is verified.
- name: Test Docker
  become: true
  ansible.builtin.command: docker version
  changed_when: false
